<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Moliscan — the Molibra explorer</title>
<meta name="description" content="Read any block, transaction or address on Molibra. One search box; everything it shows is re-derivable from the chain by anyone.">
<style>
  :root{
    --void:#07070a; --ink:#f5f3ea; --dim:#8d8a7d; --dimmer:#5a584f;
    --gold:#FFD100; --gold-dk:#c9a600; --gold-glow:rgba(255,209,0,.35);
    --glass:rgba(20,20,16,.55); --edge:rgba(255,209,0,.16);
    --bad:#ff4d4d; --ok:#66ff9e; --warn:#ffa62b;
    --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;color:var(--ink);background:var(--void);
       font:14px/1.7 var(--mono);padding:30px 18px 90px;overflow-x:hidden}
  body::before{content:"";position:fixed;inset:0;z-index:-2;
    background:
      radial-gradient(120% 80% at 50% -10%, rgba(255,209,0,.10), transparent 60%),
      repeating-linear-gradient(0deg, transparent 0 38px, rgba(255,209,0,.055) 38px 39px),
      repeating-linear-gradient(90deg, transparent 0 38px, rgba(255,209,0,.055) 38px 39px),
      var(--void);}
  body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
    background:repeating-linear-gradient(0deg, rgba(0,0,0,.28) 0 1px, transparent 1px 3px);opacity:.5}
  .wrap{max-width:860px;margin:0 auto}
  .back{color:var(--gold-dk);text-decoration:none;font-size:11px;letter-spacing:.22em;text-transform:uppercase}
  .back:hover{color:var(--gold)}
  h1{font:700 clamp(26px,5vw,40px)/1 var(--mono);letter-spacing:.2em;color:var(--gold);
     text-shadow:0 0 22px var(--gold-glow);margin:14px 0 6px}
  .tag{color:var(--dim);font-size:11px;letter-spacing:.26em;text-transform:uppercase;margin:0 0 22px}
  .panel{background:var(--glass);
    -webkit-backdrop-filter:blur(14px) saturate(130%);backdrop-filter:blur(14px) saturate(130%);
    border:1px solid var(--edge);border-radius:4px;padding:18px;margin-bottom:14px;
    box-shadow:0 0 0 1px rgba(0,0,0,.5), 0 18px 50px -30px rgba(0,0,0,.9)}
  h2{font:500 10px/1 var(--mono);letter-spacing:.3em;text-transform:uppercase;color:var(--gold-dk);margin:0 0 14px}
  .searchrow{display:flex;gap:10px;flex-wrap:wrap}
  input{flex:1 1 320px;background:rgba(0,0,0,.45);border:1px solid var(--edge);border-radius:3px;
        color:var(--ink);padding:13px;font:400 15px/1.2 var(--mono)}
  input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(255,209,0,.10)}
  button{background:var(--gold);color:#0a0a0a;border:0;border-radius:3px;padding:13px 22px;
         font:650 12px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;cursor:pointer}
  button:hover{box-shadow:0 0 22px var(--gold-glow)}
  .hint{color:var(--dimmer);font-size:11.5px;margin-top:10px}
  .kv{display:grid;grid-template-columns:auto 1fr;gap:7px 18px;font-size:12.5px}
  .kv dt{color:var(--dimmer);letter-spacing:.12em;text-transform:uppercase;font-size:10px;padding-top:3px}
  .kv dd{margin:0;color:var(--ink);word-break:break-all}
  .kv dd b{color:var(--gold);font-weight:500}
  table{border-collapse:collapse;width:100%;font-size:12px}
  th{text-align:left;color:var(--gold-dk);font-weight:600;padding:7px 10px;
     border-bottom:1px solid var(--edge);letter-spacing:.08em;font-size:10px;text-transform:uppercase}
  td{padding:7px 10px;border-bottom:1px solid rgba(255,209,0,.07);vertical-align:top}
  a.h{color:var(--gold-dk);text-decoration:none;cursor:pointer}
  a.h:hover{color:var(--gold);text-decoration:underline}
  .mut{color:var(--dim)}
  .err{color:var(--bad)}
  .ok{color:var(--ok)}
  .tw{overflow-x:auto}
</style>

<div class="wrap">
  <a class="back" href="/">&larr; molibra</a>
  <h1>MOLISCAN</h1>
  <p class="tag">block &middot; transaction &middot; address</p>

  <div class="panel">
    <h2>Search</h2>
    <div class="searchrow">
      <input id="q" placeholder="height, block hash, transaction hash, or address" spellcheck="false">
      <button id="go">Look up</button>
    </div>
    <p class="hint">A number is a height. Thirty-two bytes is a block or a transaction &mdash; both are
      tried, in that order. Twenty bytes is an address. Nothing here is an index this node built:
      every answer is read back out of the chain.</p>
  </div>

  <div id="out"></div>
</div>

<script>
// Follow the origin that served this page, as every other page here does.
const NODE = location.protocol.startsWith('http') ? location.origin : 'http://193.123.191.142:8545';
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const out = $('out');

let rpcId = 0;
async function rpc(method, params) {
  const r = await fetch(NODE + '/molibra', {
    method: 'POST', headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ jsonrpc: '2.0', id: ++rpcId, method, params }),
  });
  const j = await r.json();
  if (j.error) throw new Error(j.error.message);
  return j.result;
}
const getJSON = async (p) => {
  const r = await fetch(NODE + p);
  if (!r.ok) throw new Error(`${p} -> ${r.status}`);
  return r.json();
};

const big = (h) => (h === undefined || h === null) ? 0n : BigInt(h);
const moli = (wei) => (Number(big(wei)) / 1e18).toLocaleString(undefined, { maximumFractionDigits: 6 });
const when = (ts) => new Date(Number(big(ts)) * 1000).toISOString().replace('T', ' ').slice(0, 19);
const link = (q, text) => `<a class="h" onclick="go('${q}')">${esc(text ?? q)}</a>`;
const short = (h) => h ? h.slice(0, 12) + '…' + h.slice(-6) : '—';
const panel = (title, body) => `<div class="panel"><h2>${title}</h2>${body}</div>`;

/* ------------------------------------------------------------------ views */

function blockView(b) {
  const h = b.header ?? b;
  const n = Number(big(h.number));
  const txs = b.transactions ?? [];
  const nav = `${n > 0 ? link(String(n - 1), '← ' + (n - 1)) : '<span class="mut">← —</span>'}
     &nbsp;&nbsp; ${link(String(n + 1), (n + 1) + ' →')}`;
  const rows = txs.length
    ? `<div class="tw"><table><thead><tr><th>hash</th><th>from</th><th>to</th><th>value</th></tr></thead><tbody>`
      + txs.map((t) => `<tr>
          <td>${link(t.hash, short(t.hash))}</td>
          <td>${link(t.from, short(t.from))}</td>
          <td>${t.to ? link(t.to, short(t.to)) : '<span class="mut">contract creation</span>'}</td>
          <td>${moli(t.value)} MOLI</td></tr>`).join('')
      + '</tbody></table></div>'
    : '<p class="mut">No transactions in this block.</p>';

  return panel(`Block ${n}`, `<dl class="kv">
      <dt>height</dt><dd><b>${n}</b> &nbsp; ${nav}</dd>
      <dt>hash</dt><dd>${esc(b.hash ?? '—')}</dd>
      <dt>parent</dt><dd>${h.parentHash ? link(h.parentHash, h.parentHash) : '—'}</dd>
      <dt>time</dt><dd>${when(h.timestamp)} UTC</dd>
      <dt>miner</dt><dd>${h.miner ? link(h.miner, h.miner) : '—'}</dd>
      <dt>difficulty</dt><dd>${big(h.difficulty).toLocaleString()}</dd>
      <dt>gas used</dt><dd>${big(h.gasUsed).toLocaleString()} / ${big(h.gasLimit).toLocaleString()}</dd>
      <dt>state root</dt><dd>${esc(h.stateRoot ?? '—')}</dd>
      <dt>tx root</dt><dd>${esc(h.txRoot ?? h.transactionsRoot ?? '—')}</dd>
      <dt>canonical</dt><dd>${b.canonical === false
        ? '<span class="err">no — this block is known but not on the heaviest chain</span>'
        : '<span class="ok">yes</span>'}</dd>
    </dl>`) + panel(`Transactions (${txs.length})`, rows);
}

function txView(d) {
  const t = d.transaction, r = d.receipt;
  const expr = r && (r.voteKey || r.tokenId);
  return panel('Transaction', `<dl class="kv">
      <dt>hash</dt><dd><b>${esc(t.hash)}</b></dd>
      <dt>block</dt><dd>${t.blockNumber !== null ? link(String(Number(big(t.blockNumber))), String(Number(big(t.blockNumber)))) : '<span class="mut">pending</span>'}</dd>
      <dt>from</dt><dd>${link(t.from, t.from)}</dd>
      <dt>to</dt><dd>${t.to ? link(t.to, t.to) : '<span class="mut">contract creation</span>'}</dd>
      <dt>value</dt><dd>${moli(t.value)} MOLI</dd>
      <dt>gas price</dt><dd>${big(t.gasPrice).toLocaleString()} wei</dd>
      <dt>nonce</dt><dd>${Number(big(t.nonce))}</dd>
      <dt>input</dt><dd>${t.input && t.input !== '0x' ? esc(t.input) : '<span class="mut">none</span>'}</dd>
    </dl>`)
    + (r ? panel('Receipt', `<dl class="kv">
      <dt>status</dt><dd>${big(r.status) === 1n ? '<span class="ok">succeeded</span>' : '<span class="err">failed</span>'}</dd>
      <dt>gas used</dt><dd>${big(r.gasUsed).toLocaleString()}</dd>
      ${r.contractAddress ? `<dt>created</dt><dd>${link(r.contractAddress, r.contractAddress)}</dd>` : ''}
      ${expr ? `<dt>expression</dt><dd class="mut">this transaction was an act on the record, not a transfer</dd>` : ''}
      ${r.voteKey ? `<dt>vote key</dt><dd>${esc(r.voteKey)}</dd>` : ''}
      ${r.pollId ? `<dt>poll</dt><dd>${esc(r.pollId)}</dd>` : ''}
      ${r.tokenId ? `<dt>token</dt><dd>${esc(r.tokenId)}</dd>` : ''}
      ${r.tokenAmount ? `<dt>amount burned</dt><dd>${esc(r.tokenAmount)}</dd>` : ''}
    </dl>`) : panel('Receipt', '<p class="mut">No receipt: this transaction is not mined yet.</p>'));
}

async function addressView(addr) {
  const [bal, nonce, code] = await Promise.all([
    rpc('eth_getBalance', [addr, 'latest']),
    rpc('eth_getTransactionCount', [addr, 'latest']),
    rpc('eth_getCode', [addr, 'latest']),
  ]);
  const isContract = code && code !== '0x';
  return panel('Address', `<dl class="kv">
      <dt>address</dt><dd><b>${esc(addr)}</b></dd>
      <dt>balance</dt><dd>${moli(bal)} MOLI</dd>
      <dt>transactions</dt><dd>${Number(big(nonce))} sent</dd>
      <dt>kind</dt><dd>${isContract
        ? `contract &mdash; ${((code.length - 2) / 2).toLocaleString()} bytes of code`
        : 'ordinary account'}</dd>
    </dl>
    <p class="hint" style="margin-top:14px">⛔ There is no transaction list here. This node keeps no
      per-address index, and inventing one in the browser would mean walking every block and calling
      the result complete. What is shown is what the chain can answer exactly.</p>`);
}

/* --------------------------------------------------------------- dispatch */

async function go(qRaw) {
  const q = String(qRaw ?? $('q').value).trim();
  if (!q) return;
  $('q').value = q;
  history.replaceState(null, '', location.pathname + '?q=' + encodeURIComponent(q));
  out.innerHTML = panel('…', '<p class="mut">reading the chain…</p>');
  try {
    if (/^\d+$/.test(q)) {
      out.innerHTML = blockView(await getJSON(`/molibra/block/${q}?decoded=1`));
    } else if (/^0x[0-9a-fA-F]{64}$/.test(q)) {
      // 32 bytes is ambiguous: try the block, then the transaction. Saying which
      // one it turned out to be is more useful than asking the reader to know.
      try {
        out.innerHTML = blockView(await getJSON(`/molibra/block/${q}?decoded=1`));
      } catch {
        out.innerHTML = txView(await getJSON(`/molibra/tx/${q}`));
      }
    } else if (/^0x[0-9a-fA-F]{40}$/.test(q)) {
      out.innerHTML = await addressView(q.toLowerCase());
    } else {
      out.innerHTML = panel('Not recognised',
        `<p class="err">“${esc(q)}” is not a height, a 32-byte hash or a 20-byte address.</p>`);
      return;
    }
  } catch (e) {
    out.innerHTML = panel('Not found',
      `<p class="err">${esc(e.message)}</p><p class="mut">Nothing on this chain matches that.</p>`);
  }
}
window.go = go;
$('go').onclick = () => go();
$('q').addEventListener('keydown', (e) => { if (e.key === 'Enter') go(); });

/* ------------------------------------------------------------ latest view */

async function latest() {
  const id = await getJSON('/molibra');
  const top = Number(id.height);
  const from = Math.max(0, top - 11);
  const blocks = await getJSON(`/molibra/blocks?from=${from}&to=${top}&decoded=1`);
  const list = (blocks.blocks ?? []).slice().reverse();
  out.innerHTML = panel(`Head — height ${top.toLocaleString()}`, `<dl class="kv">
      <dt>head</dt><dd>${link(id.head, id.head)}</dd>
      <dt>chain</dt><dd>${esc(id.chain)} &middot; id ${id.chainId}</dd>
      <dt>total work</dt><dd>${big(id.totalDifficulty).toLocaleString()}</dd>
    </dl>`)
    + panel('Latest blocks', '<div class="tw"><table><thead><tr><th>height</th><th>time</th><th>txs</th><th>miner</th></tr></thead><tbody>'
      + list.map((b) => {
        const h = b.header ?? b;
        const n = Number(big(h.number));
        return `<tr><td>${link(String(n), String(n))}</td><td class="mut">${when(h.timestamp)}</td>
          <td>${(b.transactions ?? []).length}</td><td>${h.miner ? link(h.miner, short(h.miner)) : '—'}</td></tr>`;
      }).join('')
      + '</tbody></table></div>');
}

const q0 = new URLSearchParams(location.search).get('q');
if (q0) go(q0); else latest().catch((e) => {
  out.innerHTML = panel('No node', `<p class="err">this node did not answer: ${esc(e.message)}</p>`);
});
</script>
