<h1 data-t="title"></h1>
<p class="muted" data-t="intro"></p>

<div class="card">
  <h2 data-t="qKind"></h2>

  <div id="symbolRow">
    <label data-t="qSymbol"></label>

         a person creates here, and offering it as the example invites exactly
         the confusion between the coin, the chalk, and a user's token. -->
    <input id="symbol" class="mono" maxlength="11" placeholder="FEIRA">
    <label data-t="qDecimals"></label>
    <input id="decimals" type="number" min="0" max="18" value="18">
  </div>

  <div id="optionsBlock">
    <label data-t="qOptions"></label>
    <div id="options"></div>
    <p><button class="ghost" id="addOption" data-t="addOption"></button></p>
  </div>
</div>

<div class="card" id="purposeCard">
  <h2 data-t="qPurpose"></h2>
  <p class="muted small" data-t="qPurposeHelp"></p>
  <select id="purpose"></select>
  <div id="purposeNote" class="warn"></div>
</div>

<div class="card" id="modeCard">
  <h2 data-t="qMode"></h2>
  <p class="muted small" data-t="qModeHelp"></p>
  <select id="voteMode"></select>
  <div id="modeNote" class="warn"></div>
  <div id="capRow" hidden>
    <label data-t="qCap"></label>
    <input id="cap" type="number" min="1" value="2">
  </div>
</div>

<div class="card">
  <h2 data-t="qSupply" id="supplyHead"></h2>
  <p class="muted small" data-t="qSupplyHelp" id="supplyHelp"></p>
  <div id="costRow">
    <label data-t="qCost"></label>
    <input id="cost" type="number" min="1" step="1" value="1000">
    <p class="muted small" id="costNote"></p>
  </div>

  <div id="initialRow" hidden>
    <label data-t="qInitial"></label>
    <input id="initialUnits" type="number" min="0" value="1000000">
  </div>

  <label class="row"><input type="checkbox" id="issuable" checked style="width:auto">
    <span data-t="qIssuable"></span></label>
  <label class="row"><input type="checkbox" id="capped" style="width:auto">
    <span data-t="qCapped"></span></label>
  <div id="maxRow" hidden>
    <label data-t="qMax"></label>
    <input id="maxUnits" type="number" min="1" value="1000">
  </div>
  <label class="row"><input type="checkbox" id="transferable" style="width:auto">
    <span data-t="qTransferable"></span></label>
  <div id="transferNote" class="warn" hidden></div>
</div>

<div class="card">

  <p class="muted small" data-t="qSignHelp" id="signHelp"></p>

<script type="module">
import * as wallet from '/molibra/wallet.js';

/* RECORD-BEGIN — test/create-page.mjs extracts this region and checks it
   against src/token.js, so what the form refuses and what consensus refuses
   stay the same thing. Nothing here may touch the DOM. */

const UNIT = 10n ** 18n;

/** The purposes, and the two facts about each that change what the form does. */
const PURPOSES = {
  market:    { label: 'aferição de mercado',        mayTransfer: true },
  behaviour: { label: 'comportamento do consumidor', mayTransfer: true },
  social:    { label: 'comunicação social',          mayTransfer: false },
  purchase:  { label: 'expressão pública de compra', mayTransfer: false },
  electoral: { label: 'matéria eleitoral',           mayTransfer: false },
};

const VOTE_MODES = ['quantum', 'single', 'capped', 'weighted'];

/**
 * What is being created. A question, or an ordinary token that can be held and
 * sent like a token on any other chain. The chalk properties are available to
 * either; they are not what a token has to be.
 */
const KINDS = ['expression', 'asset'];
const SYMBOL_SHAPE = /^[A-Z0-9]{2,11}$/;

/** Mirrors normalizeTokenRecord. Returns a list of problems - empty is valid. */
function problemsWith(form) {
  const problems = [];
  if (!KINDS.includes(form.kind)) problems.push('needsKind');
  const isExpression = form.kind === 'expression';

  const title = String(form.title ?? '').trim();
  if (!title) problems.push('needsTitle');
  if (title.length > 200) problems.push('titleTooLong');

  if (!isExpression) {
    const symbol = String(form.symbol ?? '').trim();
    if (!symbol) problems.push('needsSymbol');
    else if (!SYMBOL_SHAPE.test(symbol)) problems.push('badSymbol');
    const decimals = Number(form.decimals ?? 18);
    if (!Number.isInteger(decimals) || decimals < 0 || decimals > 18) problems.push('badDecimals');
  }

  if (isExpression) {
    const options = (form.options ?? []).map((o) => String(o).trim()).filter(Boolean);
    if (options.length < 2) problems.push('needsTwoOptions');
    if (options.length > 64) problems.push('tooManyOptions');
    if (new Set(options.map((o) => o.toLowerCase())).size !== options.length) {
      problems.push('duplicateOptions');
    }
    if (!(form.purpose in PURPOSES)) problems.push('needsPurpose');
    if (!VOTE_MODES.includes(form.voteMode)) problems.push('needsMode');
    if (form.voteMode === 'capped' && !(Number(form.cap) >= 1)) problems.push('needsCap');
    if (!(BigInt(form.expressionCost ?? 0) > 0n)) problems.push('needsCost');

    // The naming rule, checked here so the form says so before the chain does.
    if (form.purpose === 'purchase' && /\b(enquete|enquetes|pesquisa|pesquisas)\b/i.test(title)) {
      problems.push('noEnqueteName');
    }
  }

  // The compliance keystone. It binds an ASSET too: declaring a political
  // purpose on a token that can be sent does not make it a different object,
  // and calling it an asset is not a way around the rule.
  if (form.transferable && form.purpose in PURPOSES && !PURPOSES[form.purpose].mayTransfer) {
    problems.push('cannotTransfer');
  }

  // The dead end: nothing could ever reach anybody.
  if (isExpression && !form.issuable && !form.transferable) problems.push('deadEnd');
  if (!form.issuable && !form.transferable
      && BigInt(form.initialSupply ?? 0) === 0n) problems.push('nothingToIssue');

  const max = BigInt(form.maxSupply ?? 0);
  if (max > 0n && BigInt(form.initialSupply ?? 0) > max) problems.push('supplyOverMax');
  return problems;
}

/**
 * The record exactly as the chain wants it.
 *
 * The fields that belong to the other kind are OMITTED, not sent empty: the
 * validator refuses an asset that carries options or an expression cost,
 * because a record that carries the machinery of a question it is not would be
 * a record that lies about itself.
 */
function buildRecord(form) {
  const isExpression = form.kind === 'expression';
  return {
    kind: form.kind,
    title: String(form.title).trim(),
    ...(String(form.symbol ?? '').trim() ? { symbol: String(form.symbol).trim() } : {}),
    ...(isExpression ? {} : { decimals: Number(form.decimals ?? 18) }),
    ...(isExpression ? {
      options: (form.options ?? []).map((o) => String(o).trim()).filter(Boolean),
      voteMode: form.voteMode,
      ...(form.voteMode === 'capped' ? { cap: Number(form.cap) } : {}),
      expressionCost: String(form.expressionCost),
      purpose: form.purpose,
    } : (form.purpose ? { purpose: form.purpose } : {})),
    initialSupply: String(form.initialSupply ?? '0'),
    maxSupply: String(form.maxSupply ?? '0'),
    issuable: Boolean(form.issuable),
    transferable: Boolean(form.transferable),
  };
}

/** How many expressions a whole unit of the token buys. */
function expressionsPerUnit(expressionCost) {
  const cost = BigInt(expressionCost);
  return cost > 0n ? UNIT / cost : 0n;
}

/* RECORD-END */

    p_purchase: 'purchase, publicly expressed',

    pn_market: 'Market measurement. May be transferable, if you want it to be.',

    mn_quantum: 'Each question is a voting place. A wallet speaks once in each, and how many '

/* I18N-END */

const LANG_SLOT = 'molibra.create.lang';
function pickLanguage() {
  const saved = localStorage.getItem(LANG_SLOT);
  if (saved && STRINGS[saved]) return saved;
  const url = new URLSearchParams(location.search).get('lang');
  if (url && STRINGS[url]) return url;
  for (const tag of navigator.languages ?? [navigator.language ?? '']) {
    const lower = String(tag).toLowerCase();
    if (lower.startsWith('pt')) return 'pt-BR';
    if (lower.startsWith('en')) return 'en';
  }
  return 'pt-BR';
}
let LANG = pickLanguage();
const t = (key, vars = {}) => {
  const raw = STRINGS[LANG]?.[key] ?? STRINGS.en[key] ?? key;
  return raw.replace(/\{(\w+)\}/g, (_, n) => (n in vars ? vars[n] : `{${n}}`));
};

/* ------------------------------------------------------------------- ui */
const $ = (id) => document.getElementById(id);
const VAULT_SLOT = 'molibra.chalk.vault.v1';
let signer = null;   // { kind: 'wallet' } | { kind: 'key', privateKey, address }
let address = null;
let chainIdDec = 20226;

function optionRows() {
  return [...$('options').querySelectorAll('input')].map((i) => i.value);
}

function addOption(value = '') {
  const row = document.createElement('div');
  row.className = 'row';
  const input = document.createElement('input');
  input.value = value;
  input.oninput = refresh;
  const del = document.createElement('button');
  del.className = 'ghost';
  del.textContent = '×';
  del.onclick = () => { row.remove(); refresh(); };
  row.append(input, del);
  $('options').appendChild(row);
}

function readForm() {
  const costMillionths = BigInt($('cost').value || '0');
  const kind = $('kind').value;
  const isExpression = kind === 'expression';
  return {
    kind,
    title: $('title').value,
    symbol: $('symbol').value.trim().toUpperCase(),
    decimals: Number($('decimals').value || '18'),
    options: optionRows(),
    // An asset answers no question, so it declares no purpose. Leaving one
    // attached would put a political label on a tradable token, which is the
    // one combination the chain refuses outright.
    purpose: isExpression ? $('purpose').value : '',
    voteMode: isExpression ? $('voteMode').value : '',
    cap: $('cap').value,
    // The form asks for millionths of a unit, because "1000" is a number a
    // person can hold in their head and 10^12 is not.
    expressionCost: isExpression ? (costMillionths * (UNIT / 1000000n)).toString() : '0',
    initialSupply: isExpression
      ? '0' : (BigInt($('initialUnits').value || '0') * UNIT).toString(),
    maxSupply: $('capped').checked
      ? (BigInt($('maxUnits').value || '0') * UNIT).toString() : '0',
    issuable: $('issuable').checked,
    transferable: $('transferable').checked,
  };
}

function refresh() {
  const form = readForm();
  const isExpression = form.kind === 'expression';
  const purpose = PURPOSES[form.purpose];

  // The two kinds ask for different things, so the form shows different
  // things. Nothing is merely disabled: a field that does not apply is a
  // field that should not be on the screen.
  $('kindNote').innerHTML = t('kn_' + form.kind);
  // The words follow the kind. A form that calls a currency "the question"
  // has told the person it does not know what they are making.
  const suffix = isExpression ? '' : '_asset';
  $('titleHead').innerHTML = t('qTitle' + suffix);
  $('titleHelp').innerHTML = t('qTitleHelp' + suffix);
  $('title').placeholder = t('qTitlePlaceholder' + suffix);
  $('supplyHead').innerHTML = t('qSupply' + suffix);
  $('supplyHelp').innerHTML = t('qSupplyHelp' + suffix);
  $('signHelp').innerHTML = t('qSignHelp' + suffix);
  $('optionsBlock').hidden = !isExpression;
  $('symbolRow').hidden = isExpression;
  $('purposeCard').hidden = !isExpression;
  $('modeCard').hidden = !isExpression;
  $('costRow').hidden = !isExpression;
  $('initialRow').hidden = isExpression;

  if (isExpression) {
    $('purposeNote').innerHTML = t('pn_' + form.purpose);
    $('modeNote').innerHTML = t('mn_' + form.voteMode);
  }
  $('capRow').hidden = !isExpression || form.voteMode !== 'capped';
  $('maxRow').hidden = !$('capped').checked;

  // Transferability is not offered where consensus would refuse it, and the
  // reason is shown rather than the control silently vanishing. An asset
  // declares no purpose, so nothing stands in its way.
  const mayTransfer = purpose ? purpose.mayTransfer : true;
  $('transferable').disabled = !mayTransfer;
  if (!mayTransfer) $('transferable').checked = false;
  $('transferNote').hidden = mayTransfer;
  $('transferNote').innerHTML = t('cannotTransfer');

  const perUnit = expressionsPerUnit(form.expressionCost);
  $('costNote').textContent = isExpression && perUnit > 0n
    ? t('perUnit', { n: perUnit.toLocaleString(LANG) }) : '';

  const problems = problemsWith(form);
  // A problem may read differently for an asset ("needs a name" rather than
  // "needs a title"). Where no asset wording exists, the shared one is used -
  // checked by looking the key up, not by pattern-matching the result, which
  // would print a raw key the day somebody adds a problem and forgets a
  // translation.
  const problemText = (key) => {
    const alt = key + '_asset';
    const hasAlt = (STRINGS[LANG]?.[alt] ?? STRINGS.en[alt]) !== undefined;
    return t(!isExpression && hasAlt ? alt : key);
  };
  $('problems').innerHTML = problems
    .map((key) => `<div class="stop">${problemText(key)}</div>`).join('');

  const ok = problems.length === 0;
  $('create').disabled = !ok || !signer;
  $('data').textContent = ok ? encodeTokenCreate(buildRecord(form)) : '—';
  return { form, ok };
}

/* The TOKEN_CREATE payload: tag + utf8 JSON, exactly as src/token.js builds it. */
const TOKEN_CREATE_TAG = '0x73306244';
const encodeTokenCreate = (record) => TOKEN_CREATE_TAG
  + Array.from(new TextEncoder().encode(JSON.stringify(record)),
      (b) => b.toString(16).padStart(2, '0')).join('');

/* --------------------------------------------------------------- signing */
function setSigner(next, addr) {
  signer = next;
  address = addr.toLowerCase();
  $('who').innerHTML = t('connected', { address: `<code>${address}</code>` });
  refresh();
}

$('useWallet').onclick = async () => {
  if (!window.ethereum) {
    window.molibraWallet.mount();
    return ($('who').textContent = window.molibraWallet.message());
  }
  try {
    const [a] = await window.ethereum.request({ method: 'eth_requestAccounts' });
    setSigner({ kind: 'wallet' }, a);
  } catch (e) { $('who').innerHTML = t('failed', { error: e.message }); }
};

$('useKey').onclick = () => {
  if (!localStorage.getItem(VAULT_SLOT)) return ($('who').innerHTML = t('noKey'));
  $('unlock').hidden = false;
};

$('unlockNow').onclick = async () => {
  try {
    const opened = await wallet.open(JSON.parse(localStorage.getItem(VAULT_SLOT)), $('pass').value);
    $('pass').value = '';
    $('unlock').hidden = true;
    setSigner({ kind: 'key', privateKey: opened.privateKey }, opened.address);
  } catch (e) {
    $('who').innerHTML = /wrong passphrase/.test(e.message) ? t('wrongPass') : e.message;
  }
};

/* --------------------------------------------------------------- create */
$('create').onclick = async () => {
  const { form, ok } = refresh();
  if (!ok || !signer) return;
  const data = encodeTokenCreate(buildRecord(form));
  $('out').className = 'small muted';
  try {
    // Creating a token costs gas in MOLI, like any other transaction. Checked
    // here so the person is told before they sign, rather than after a node
    // refuses a transaction they already approved.
    const balance = BigInt(await rpc('eth_getBalance', [address, 'latest']));
    const gasPrice = BigInt(await rpc('eth_gasPrice', []));
    const needed = 300000n * gasPrice;
    if (balance < needed) {
      $('out').className = 'small err';
      $('out').innerHTML = t('needsMoli', {
        have: (Number(balance) / 1e18).toFixed(4),
        need: (Number(needed) / 1e18).toFixed(4),
      });
      return;
    }
    let hash;
    if (signer.kind === 'wallet') {
      $('out').innerHTML = t('sending');
      hash = await window.ethereum.request({
        method: 'eth_sendTransaction',
        // Self-addressed, zero value: creating a question moves no money.
        params: [{ from: address, to: address, value: '0x0', data, gas: '0x493e0' }],
      });
    } else {
      const nonce = await rpc('eth_getTransactionCount', [address, 'pending']);
      const gasPrice = await rpc('eth_gasPrice', []);
      const raw = wallet.signTransaction({
        nonce: BigInt(nonce), gasPrice: BigInt(gasPrice), gasLimit: 300000n,
        to: address, value: 0n, data,
      }, signer.privateKey, chainIdDec);
      hash = await rpc('eth_sendRawTransaction', [raw]);
    }
    $('out').className = 'small ok';
    $('out').innerHTML = t('sent', { hash });
  } catch (e) {
    $('out').className = 'small err';
    $('out').innerHTML = t('failed', { error: e.message || e });
  }
};

async function rpc(method, params) {
  const r = await fetch('/', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ jsonrpc: '2.0', id: 1, method, params }),
  });
  const body = await r.json();
  if (body.error) throw new Error(body.error.message);
  return body.result;
}

/* ----------------------------------------------------------------- boot */
function applyLanguage() {
  document.documentElement.lang = LANG === 'pt-BR' ? 'pt-BR' : 'en';
  for (const el of document.querySelectorAll('[data-t]')) el.innerHTML = t(el.dataset.t);
  for (const el of document.querySelectorAll('[data-t-placeholder]')) {
    el.placeholder = t(el.dataset.tPlaceholder);
  }
  document.title = t('title') + ' — Molibra';
  $('kind').innerHTML = KINDS
    .map((k) => `<option value="${k}">${t('k_' + k)}</option>`).join('');
  $('purpose').innerHTML = Object.keys(PURPOSES)
    .map((p) => `<option value="${p}">${t('p_' + p)}</option>`).join('');
  $('voteMode').innerHTML = VOTE_MODES
    .map((m) => `<option value="${m}">${t('m_' + m)}</option>`).join('');
}

function render(keepValues) {
  const purpose = keepValues ? $('purpose').value : 'purchase';
  const mode = keepValues ? $('voteMode').value : 'quantum';
  const kind = keepValues ? $('kind').value : 'expression';
  applyLanguage();
  $('kind').value = kind;
  $('purpose').value = purpose;
  $('voteMode').value = mode;
  for (const b of $('langs').children) {
    b.setAttribute('aria-current', b.dataset.lang === LANG ? 'true' : 'false');
  }
  refresh();
}

for (const code of Object.keys(STRINGS)) {
  const b = document.createElement('button');
  b.textContent = STRINGS[code].lang;
  b.dataset.lang = code;
  b.onclick = () => { LANG = code; localStorage.setItem(LANG_SLOT, code); render(true); };
  $('langs').appendChild(b);
}

// An asset is normally meant to move; a question normally is not. The default
// follows the kind, and the person can still say otherwise.
$('kind').addEventListener('change', () => {
  $('transferable').checked = $('kind').value === 'asset';
  refresh();
});

addOption();
addOption();
$('addOption').onclick = () => { addOption(); refresh(); };
for (const id of ['kind', 'title', 'symbol', 'decimals', 'purpose', 'voteMode', 'cap',
                  'cost', 'initialUnits', 'issuable', 'capped', 'maxUnits', 'transferable']) {
  $(id).addEventListener('input', refresh);
  $(id).addEventListener('change', refresh);
}
render(false);

fetch('/molibra').then((r) => r.json()).then((c) => {
  if (c.chainId) chainIdDec = Number(c.chainId);
}).catch(() => {});
</script>
