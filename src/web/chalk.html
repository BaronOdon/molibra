/* The wallet module is the same file test/wallet.mjs checks against the node's
   own signer, byte for byte. Its maths is served from this node, not a CDN:
   a page that mints somebody's private key must not fetch its own primitives
   from a third party who can change them without telling anyone. */
import * as wallet from '/molibra/wallet.js';

/* PUZZLE-BEGIN — test/browser-work.mjs extracts exactly this region and checks

/* ------------------------------------------------------------------ sha256
   Inline and self-contained: the earning puzzle must run with nothing else
   loaded. The chain's own proof of work is Keccak-256 and lives in the node;
   this is only the faucet's cost function. */
const K = new Int32Array([
  0x428a2f98|0,0x71374491|0,0xb5c0fbcf|0,0xe9b5dba5|0,0x3956c25b|0,0x59f111f1|0,0x923f82a4|0,0xab1c5ed5|0,

  0x27b70a85|0,0x2e1b2138|0,0x4d2c6dfc|0,0x53380d13|0,0x650a7354|0,0x766a0abb|0,0x81c2c92e|0,0x92722c85|0,
  0xa2bfe8a1|0,0xa81a664b|0,0xc24b8b70|0,0xc76c51a3|0,0xd192e819|0,0xd6990624|0,0xf40e3585|0,0x106aa070|0,
  0x19a4c116|0,0x1e376c08|0,0x2748774c|0,0x34b0bcb5|0,0x391c0cb3|0,0x4ed8aa4a|0,0x5b9cca4f|0,0x682e6ff3|0,
  0x748f82ee|0,0x78a5636f|0,0x84c87814|0,0x8cc70208|0,0x90befffa|0,0xa4506ceb|0,0xbef9a3f7|0,0xc67178f2|0]);

const W = new Int32Array(64);

/* One 64-byte block is all we ever hash: 16-byte challenge + 20-byte address +
   8-byte nonce = 44 bytes, which pads into a single block. Returns the first
   six bytes of the digest as a Number, which is what the node compares. */
function digestValue(block) {
  for (let i = 0; i < 16; i++) W[i] = block[i];
  for (let i = 16; i < 64; i++) {
    const a = W[i-15], b = W[i-2];
    const s0 = ((a>>>7)|(a<<25)) ^ ((a>>>18)|(a<<14)) ^ (a>>>3);
    const s1 = ((b>>>17)|(b<<15)) ^ ((b>>>19)|(b<<13)) ^ (b>>>10);
    W[i] = (W[i-16] + s0 + W[i-7] + s1) | 0;
  }
  let a=0x6a09e667|0,b=0xbb67ae85|0,c=0x3c6ef372|0,d=0xa54ff53a|0,
      e=0x510e527f|0,f=0x9b05688c|0,g=0x1f83d9ab|0,h=0x5be0cd19|0;
  for (let i = 0; i < 64; i++) {
    const S1 = ((e>>>6)|(e<<26)) ^ ((e>>>11)|(e<<21)) ^ ((e>>>25)|(e<<7));
    const ch = (e & f) ^ (~e & g);
    const t1 = (h + S1 + ch + K[i] + W[i]) | 0;
    const S0 = ((a>>>2)|(a<<30)) ^ ((a>>>13)|(a<<19)) ^ ((a>>>22)|(a<<10));
    const mj = (a & b) ^ (a & c) ^ (b & c);
    const t2 = (S0 + mj) | 0;
    h=g; g=f; f=e; e=(d+t1)|0; d=c; c=b; b=a; a=(t1+t2)|0;
  }
  const h0 = ((0x6a09e667|0) + a) >>> 0;
  const h1 = ((0xbb67ae85|0) + b) >>> 0;
  return h0 * 65536 + (h1 >>> 16);
}

const hexBytes = (hex) => {
  const h = hex.replace(/^0x/, '');
  const b = new Uint8Array(h.length / 2);
  for (let i = 0; i < b.length; i++) b[i] = parseInt(h.substr(i * 2, 2), 16);
  return b;
};

function buildBlock(challenge, address) {
  const bytes = new Uint8Array(64);
  bytes.set(hexBytes(challenge), 0);   // 16
  bytes.set(hexBytes(address), 16);    // 20  -> nonce occupies bytes 36..43,
                                       // which is words[9] (high) and words[10] (low)
  bytes[44] = 0x80;                    // padding
  bytes[62] = 0x01; bytes[63] = 0x60;  // length: 44 bytes = 352 bits
  const words = new Int32Array(16);
  const view = new DataView(bytes.buffer);
  for (let i = 0; i < 16; i++) words[i] = view.getInt32(i * 4, false);
  return words;
}

/* PUZZLE-END */

const LANG_KEY = 'molibra.chalk.lang';

/**
 * pt-BR is the default. The audience is Brazilian, so English is what you get
 * by asking for it - either through the browser's own language preference or
 * the switcher - not what everyone gets by default.
 */
function pickLanguage() {
  const saved = localStorage.getItem(LANG_KEY);
  if (saved && STRINGS[saved]) return saved;
  const url = new URLSearchParams(location.search).get('lang');
  if (url && STRINGS[url]) return url;
  for (const tag of navigator.languages ?? [navigator.language ?? '']) {
    const lower = String(tag).toLowerCase();
    if (lower.startsWith('pt')) return 'pt-BR';
    if (lower.startsWith('en')) return 'en';
  }
  return 'pt-BR';
}

let LANG = pickLanguage();

/**
 * Look up a string. `{name}` placeholders are filled from `vars`.
 *
 * When `vars.n` is present and the key has `_one`/`_other` variants, the count
 * picks the variant - because "1 concessões feitas" is wrong in Portuguese and
 * "1 grants made" is wrong in English, and a plural rule is cheaper than
 * either apology.
 *
 * A key that exists in no language is returned as-is, so a raw message from an
 * exception can be passed straight through.
 */
const t = (key, vars = {}) => {
  const table = STRINGS[LANG] ?? STRINGS.en;
  let raw = table[key] ?? STRINGS.en[key];
  if (raw === undefined && 'n' in vars) {
    const variant = Number(vars.n) === 1 ? '_one' : '_other';
    raw = table[key + variant] ?? STRINGS.en[key + variant];
  }
  if (raw === undefined) {
    const variant = table[key + '_other'] ?? STRINGS.en[key + '_other'];
    raw = variant ?? key;
  }
  return raw.replace(/\{(\w+)\}/g, (_, name) => (name in vars ? vars[name] : `{${name}}`));
};

function applyLanguage() {
  document.documentElement.lang = LANG === 'pt-BR' ? 'pt-BR' : 'en';
  for (const el of document.querySelectorAll('[data-t]')) el.innerHTML = t(el.dataset.t);
  for (const el of document.querySelectorAll('[data-t-placeholder]')) {
    el.placeholder = t(el.dataset.tPlaceholder);
  }
  document.title = t('title') + ' — Molibra';
}


/* ------------------------------------------------------------------ state */
const $ = (id) => document.getElementById(id);
// The localStorage slot the sealed key lives in. A NAME, not a secret - it is
// renamed away from anything ending in _KEY because secret scanners flag the
// word and a false positive that fires on every commit trains people to ignore
// the scanner.
const VAULT_SLOT = 'molibra.chalk.vault.v1';
// Status lines remember WHICH string they are showing, not just the rendered
// text, so switching language re-renders them too. Without this the page
// changes language around a sentence that stays in the old one.
const shown = {};
function status(id) {
  return (key, vars = {}, cls = 'muted') => {
    shown[id] = { key, vars, cls };
    const el = $(id);
    el.className = 'small ' + cls;
    el.innerHTML = t(key, vars);
  };
}
const out = status('out');
const keyOut = status('keyOut');
const backOut = status('backOut');
const reshow = () => {
  for (const [id, s] of Object.entries(shown)) {
    $(id).className = 'small ' + s.cls;
    $(id).innerHTML = t(s.key, s.vars);
  }
};

// How we sign, decided in step 1 and never mixed:
//   'wallet'    - the person's own wallet signs everything; we never see a key
//   'generated' - a key made here, sealed on this device, used here
//   'address'   - an address they typed; we can receive, but cannot sign
let mode = null;
let key = null;      // Uint8Array, only in `generated` mode
let address = null;
let chainIdDec = 20226;

const params = new URLSearchParams(location.search);
// The app supplies where to come back to. The page hardcodes no scheme it
// cannot verify - the app owns its own URL.
const returnTo = params.get('return');
const appAccount = params.get('app') || params.get('appAccount');

function setAddress(next, how) {
  address = next.toLowerCase();
  mode = how;
  $('addr').value = address;
  $('go').disabled = false;
  $('reveal').hidden = how !== 'generated';
  out('readyGen');
}

/* -------------------------------------------------------- the wallet path */
$('useWallet').onclick = async () => {
  if (!window.ethereum) return keyOut('noWalletHere', {}, 'err');
  try {
    const [account] = await window.ethereum.request({ method: 'eth_requestAccounts' });
    setAddress(account, 'wallet');
    keyOut('walletConnected', {}, 'ok');
  } catch (e) { keyOut('failed', { error: e.message }, 'err'); }
};

/* ----------------------------------------------------- the generated path */
$('makeKey').onclick = () => {
  $('keyForm').hidden = !!localStorage.getItem(VAULT_SLOT);
  $('unlockForm').hidden = !localStorage.getItem(VAULT_SLOT);
};

$('createNow').onclick = async () => {
  const p1 = $('pass').value, p2 = $('pass2').value;
  if (p1.length < 8) return keyOut('pass8', {}, 'err');
  if (p1 !== p2) return keyOut('passMismatch', {}, 'err');
  try {
    keyOut('sealing');
    key = wallet.generatePrivateKey();
    const vault = await wallet.seal(key, p1);
    localStorage.setItem(VAULT_SLOT, JSON.stringify(vault));
    setAddress(wallet.addressFor(key), 'generated');
    $('keyForm').hidden = true;
    $('pass').value = $('pass2').value = '';
    keyOut('keyCreated', {}, 'ok');
  } catch (e) { keyOut('failed', { error: e.message }, 'err'); }
};

$('unlockNow').onclick = async () => {
  try {
    const vault = JSON.parse(localStorage.getItem(VAULT_SLOT));
    const opened = await wallet.open(vault, $('unlockPass').value);
    key = opened.privateKey;
    setAddress(opened.address, 'generated');
    $('unlockForm').hidden = true;
    $('unlockPass').value = '';
    keyOut('unlocked', {}, 'ok');
  } catch (e) { keyOut(/wrong passphrase/.test(e.message) ? 'wrongPass' : e.message, {}, 'err'); }
};

$('forget').onclick = () => {
  if (!confirm(t('confirmForget'))) return;
  localStorage.removeItem(VAULT_SLOT);
  key = null; address = null; mode = null;
  $('unlockForm').hidden = true; $('addr').value = ''; $('go').disabled = true;
  keyOut('deleted', {}, 'muted');
};

$('reveal').onclick = () => {
  if (!key) return;
  const box = $('secret');
  if (!box.hidden) { box.hidden = true; box.textContent = ''; return; }
  box.hidden = false;
  box.innerHTML = t('secretWarn') + '<br><br><code>0x'
    + Array.from(key, (b) => b.toString(16).padStart(2, '0')).join('') + '</code>';
};

$('addr').oninput = () => {
  const v = $('addr').value.trim().toLowerCase();
  if (/^0x[0-9a-f]{40}$/.test(v) && v !== address) {
    address = v; mode = 'address'; key = null;
    $('reveal').hidden = true;
    $('go').disabled = false;
    out('readyPasted');
  }
};

$('copy').onclick = async () => {
  if (!address) return keyOut('nothingCopy', {}, 'err');
  try { await navigator.clipboard.writeText(address); keyOut('copied', {}, 'ok'); }
  catch { keyOut('copyFail', {}, 'err'); }
};

/* --------------------------------------------------------------- the grind */
let running = false;
$('stop').onclick = () => { running = false; };

$('go').onclick = async () => {
  if (!address) return out('chooseFirst', {}, 'err');
  $('go').disabled = true; $('stop').disabled = false; $('bar').style.width = '0';

  let job;
  try {
    const r = await fetch('/molibra/earn?address=' + address);
    job = await r.json();
    if (job.error) throw new Error(job.error);
  } catch (e) {
    $('go').disabled = false; $('stop').disabled = true;
    return out(e.message, 'err');
  }

  out('working', { tries: job.difficulty.toLocaleString(LANG), n: job.expressions });

  const words = buildBlock(job.challenge, address);
  const threshold = job.threshold;
  running = true;
  let nonce = 0;
  const started = Date.now();

  const slice = () => {
    if (!running) {
      $('go').disabled = false; $('stop').disabled = true;
      return out('stopped', {}, 'muted');
    }
    const end = nonce + 20000;
    for (; nonce < end; nonce++) {
      // The nonce is a 64-bit big-endian field at bytes 36..43. Only its LOW
      // word moves here, so the page searches nonces below 2^32 - far more
      // than any browser-scale difficulty needs, and the high word stays the
      // zero the node expects.
      words[10] = nonce | 0;
      if (digestValue(words) < threshold) return solved(nonce);
    }
    const pct = Math.min(99, Math.round((nonce / (job.difficulty * 2)) * 100));
    $('bar').style.width = pct + '%';
    setTimeout(slice, 0);
  };

  async function solved(found) {
    running = false;
    $('bar').style.width = '100%';
    const secs = ((Date.now() - started) / 1000).toFixed(1);
    out('solved', { secs, tries: found.toLocaleString(LANG) });
    try {
      const r = await fetch('/molibra/earn', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ address, challenge: job.challenge, nonce: found }),
      });
      const body = await r.json();
      if (!body.ok) throw new Error(body.error);
      out('onItsWay', { hash: body.grant.txHash, n: body.grant.expressions }, 'ok');
      $('cardEarn').classList.add('done');
      $('back').disabled = false;
    } catch (e) {
      out('claimRefused', { error: e.message }, 'err');
    }
    $('go').disabled = false; $('stop').disabled = true;
  }

  setTimeout(slice, 0);
};

/* ------------------------------------------------------- back to the app */
$('back').onclick = async () => {
  if (!address) return backOut('noAddress', {}, 'err');
  try {
    backOut('signingProof');
    const challenge = await (await fetch('/molibra/challenge')).json();
    const account = appAccount || prompt(t('appAccountPrompt'));
    if (!account) return backOut('cancelled', {}, 'muted');

    let code;
    if (mode === 'generated') {
      code = wallet.linkingCode({
        chainId: chainIdDec, address, appAccount: account, challenge, privateKey: key,
      });
    } else if (mode === 'wallet') {
      // They have a wallet, so the WALLET signs - this page never asks for,
      // holds or sees a key it did not create.
      const message = [
        'Molibra linking proof',
        'chainId: ' + chainIdDec,
        'address: ' + address,
        'app account: ' + account,
        'nonce: ' + challenge.nonce,
        'expires: ' + challenge.expires,
        '',
        'Signing proves control of this address. It moves no funds.',
      ].join('\n');
      const signature = await window.ethereum.request({
        method: 'personal_sign', params: [message, address],
      });
      code = btoa(JSON.stringify({ m: message, s: signature, a: address }))
        .replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    } else {
      return backOut('cannotSignPasted', {}, 'err');
    }

    if (returnTo) {
      const url = returnTo + (returnTo.includes('?') ? '&' : '?')
        + 'address=' + encodeURIComponent(address) + '&code=' + encodeURIComponent(code);
      backOut('returning', {}, 'ok');
      location.href = url;
    } else {
      $('pasteNote').hidden = false;
      $('proof').hidden = false;
      $('proof').value = code;
      $('proof').select();
      backOut('pasteCode', {}, 'ok');
    }
  } catch (e) { backOut('failed', { error: e.message || e }, 'err'); }
};

/* ----------------------------------------------------------------- boot */
let issuerFacts = null;

function render() {
  applyLanguage();
  reshow();
  if (!window.ethereum) $('walletRow').hidden = true;
  else $('noWalletNote').innerHTML = t('walletFound');
  if (!returnTo) $('backNote').innerHTML = t('backNote') + t('backDirect');
  if (!address && !shown.out) out('chooseFirst');
  if (issuerFacts && !issuerFacts.error) {
    $('facts').innerHTML = `${issuerFacts.token ? issuerFacts.token.title : issuerFacts.tokenId}`
      + ` &middot; ${t('grantsMade', { n: issuerFacts.grantsMade })} &middot; ${t('rule')}.`;
  }
  for (const b of $('langs').children) {
    b.setAttribute('aria-current', b.dataset.lang === LANG ? 'true' : 'false');
  }
}

for (const code of Object.keys(STRINGS)) {
  const b = document.createElement('button');
  b.textContent = STRINGS[code].lang;
  b.dataset.lang = code;
  b.onclick = () => { LANG = code; localStorage.setItem(LANG_KEY, code); render(); };
  $('langs').appendChild(b);
}

render();

if (localStorage.getItem(VAULT_SLOT)) {
  $('unlockForm').hidden = false;
  keyOut('unlockHelp');
}

fetch('/molibra/issuer').then((r) => r.json()).then((i) => {
  issuerFacts = i;
  if (i.error) return $('facts').textContent = i.error;
  render();
}).catch(() => {});

fetch('/molibra').then((r) => r.json()).then((c) => {
  if (c.chainId) chainIdDec = Number(c.chainId);
}).catch(() => {});
</script>
