<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" type="image/svg+xml" href="/icon.svg">
<title>Molibra · Artigos / Articles</title>
<meta name="description" content="Molibra papers in 16 languages, each set authenticated on chain by one DocumentRegistry record.">
<!--
  The articles, in every language the site speaks.

  ⛔ Authentication works like record #1 (the e-mail that carried the manifesto
  to the United Nations): one DocumentRegistry record per article, whose hash is
  the article's MANIFEST.txt. The manifest lists the SHA-256 of every language's
  PDF, so a reader checks a download against the manifest and the manifest
  against the chain - read live here, never asserted by the page.

  Text goes in by textContent only. The catalogue is /articles/index.json,
  built by articles/build-index.mjs.
-->
<style>
  :root{--bg:#0b0b0c;--panel:#141416;--line:#26262b;--ink:#ececf0;--dim:#8b8b94;--gold:#FFD100;--bad:#ff5c5c;--ok:#5cd18b}
  body{margin:0 auto;background:var(--bg);color:var(--ink);padding:24px 16px;max-width:980px;
       font:15px/1.6 ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,"Noto Sans",sans-serif}
  a{color:var(--gold)}
  header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:6px}
  .brand{font:800 14px/1 ui-monospace,Menlo,monospace;letter-spacing:.3em;color:var(--gold);text-decoration:none}
  select{background:#141416;color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:6px 12px}
  h1{font-size:24px;margin:18px 0 4px} .sub{color:var(--dim);margin:0 0 22px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:18px}
  .card h2{font-size:19px;margin:0 0 6px;line-height:1.35}
  .meta{color:var(--dim);font-size:13px;margin:0 0 14px}
  .open{display:inline-block;background:var(--gold);color:#111;border-radius:8px;padding:9px 16px;font-weight:650;text-decoration:none;margin:4px 0 14px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  td,th{border-top:1px solid var(--line);padding:7px 6px;text-align:start;vertical-align:top;overflow-wrap:anywhere}
  .card,.auth dd{min-width:0;overflow-wrap:anywhere}
  th{color:var(--dim);font-weight:500}
  td.mono,.mono{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;word-break:break-all;color:var(--dim)}
  tr.cur td{background:#1a1608}
  .auth{border-left:3px solid var(--gold);background:#1a1608;padding:10px 12px;margin-top:14px;font-size:13px}
  .auth dl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:8px 0 0}
  .auth dt{color:var(--dim)} .auth dd{margin:0}
  .badge{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:650}
  .ok{background:#11301f;color:var(--ok)} .no{background:#301111;color:var(--bad)} .wait{background:#2a2410;color:var(--gold)}
  .hide-sm{} @media (max-width:640px){ .hide-sm{display:none} td,th{padding:6px 3px} }
  footer{color:var(--dim);font-size:12px;margin-top:28px}
</style>

<header>
  <a class="brand" href="/">MOLIBRA</a>
  <label><span id="langLabel" hidden>Language</span><select id="lang" aria-label="Language"></select></label>
</header>
<h1 id="h1">Artigos</h1>
<p class="sub" id="sub"></p>
<main id="list"></main>
<p class="sub" id="state"></p>
<footer id="foot"></footer>

<script>
// ⛔ The origin that SERVED this page (https on molibra.org); the literal is only
// the fallback for opening the file from disk.
const NODE = location.protocol.startsWith('http') ? location.origin : 'http://193.123.191.142:8545';
const REGISTRY = '0xeadcd3e918be3ad67a6b5c2a3c4fa8e59a809946';
const SEL = { numberOf: '0xfd8e1856', status: '0x52ad0d5e' };
const OPERATOR = '0xf51ac8FD4112bF1d45fD5C38D5aBfe0c61Ec3F5a';

const LANGS = [
  ['pt','Português'],['en','English'],['es','Español'],['fr','Français'],['de','Deutsch'],['it','Italiano'],
  ['nl','Nederlands'],['pl','Polski'],['ru','Русский'],['tr','Türkçe'],['id','Bahasa Indonesia'],['hi','हिन्दी'],
  ['ar','العربية'],['ja','日本語'],['ko','한국어'],['zh','中文'],
];
// UI strings: [h1, sub, read, langs, sha, auth, manifest, registry, record, ok, wait, no, verify, original, loading, connect+authenticate]
const T = {

  en: ['Articles','The papers in every language the site speaks. Each set is authenticated on Molibra by one DocumentRegistry record.','Read the PDF','Languages','SHA-256','Authentication on the network','Manifest','Registry','Record no.','registered · signed','registered · awaiting signature','not registered yet','Check a download: the PDF’s SHA-256 is in the manifest, and the manifest’s SHA-256 is the record.','original','loading…','Connect wallet and authenticate'],
  es: ['Artículos','Los artículos en todos los idiomas del sitio. Cada conjunto se autentica en Molibra con un registro en la DocumentRegistry.','Leer el PDF','Idiomas','SHA-256','Autenticación en la red','Manifiesto','Registro','Registro n.º','registrado · firmado','registrado · esperando firma','aún no registrado','Compruebe una descarga: el SHA-256 del PDF está en el manifiesto, y el SHA-256 del manifiesto es el registro.','original','cargando…','Conectar cartera y autenticar'],
  fr: ['Articles','Les articles dans toutes les langues du site. Chaque ensemble est authentifié sur Molibra par un enregistrement dans la DocumentRegistry.','Lire le PDF','Langues','SHA-256','Authentification sur le réseau','Manifeste','Registre','Enregistrement n°','enregistré · signé','enregistré · en attente de signature','pas encore enregistré','Vérifiez un téléchargement : le SHA-256 du PDF figure dans le manifeste, et le SHA-256 du manifeste est l’enregistrement.','original','chargement…','Connecter le portefeuille et authentifier'],
  de: ['Artikel','Die Artikel in allen Sprachen der Website. Jede Fassung wird auf Molibra durch einen Eintrag in der DocumentRegistry beglaubigt.','PDF lesen','Sprachen','SHA-256','Beglaubigung im Netzwerk','Manifest','Register','Eintrag Nr.','eingetragen · signiert','eingetragen · wartet auf Signatur','noch nicht eingetragen','Download prüfen: Der SHA-256 der PDF steht im Manifest, und der SHA-256 des Manifests ist der Eintrag.','Original','lädt…','Wallet verbinden und beglaubigen'],
  it: ['Articoli','Gli articoli in tutte le lingue del sito. Ogni insieme è autenticato su Molibra da una registrazione nella DocumentRegistry.','Leggi il PDF','Lingue','SHA-256','Autenticazione sulla rete','Manifesto','Registro','Registrazione n.','registrato · firmato','registrato · in attesa di firma','non ancora registrato','Verifica un download: lo SHA-256 del PDF è nel manifesto, e lo SHA-256 del manifesto è la registrazione.','originale','caricamento…','Collega il portafoglio e autentica'],
  nl: ['Artikelen','De artikelen in alle talen van de site. Elke set wordt op Molibra gewaarmerkt door één registratie in de DocumentRegistry.','PDF lezen','Talen','SHA-256','Waarmerking op het netwerk','Manifest','Register','Registratie nr.','geregistreerd · ondertekend','geregistreerd · wacht op handtekening','nog niet geregistreerd','Controleer een download: de SHA-256 van de pdf staat in het manifest, en de SHA-256 van het manifest is de registratie.','origineel','laden…','Wallet verbinden en waarmerken'],
  pl: ['Artykuły','Artykuły we wszystkich językach serwisu. Każdy zestaw jest uwierzytelniony w Molibrze jednym wpisem w DocumentRegistry.','Czytaj PDF','Języki','SHA-256','Uwierzytelnienie w sieci','Manifest','Rejestr','Wpis nr','zarejestrowany · podpisany','zarejestrowany · czeka na podpis','jeszcze niezarejestrowany','Sprawdź pobrany plik: SHA-256 PDF-u jest w manifeście, a SHA-256 manifestu jest wpisem.','oryginał','ładowanie…','Połącz portfel i uwierzytelnij'],
  ru: ['Статьи','Статьи на всех языках сайта. Каждый комплект заверен в Molibra одной записью в DocumentRegistry.','Читать PDF','Языки','SHA-256','Подтверждение в сети','Манифест','Реестр','Запись №','зарегистрировано · подписано','зарегистрировано · ожидает подписи','ещё не зарегистрировано','Проверьте загрузку: SHA-256 PDF указан в манифесте, а SHA-256 манифеста — это запись.','оригинал','загрузка…','Подключить кошелёк и заверить'],
  tr: ['Makaleler','Makaleler sitenin tüm dillerinde. Her set Molibra’da DocumentRegistry’deki tek bir kayıtla doğrulanır.','PDF’yi oku','Diller','SHA-256','Ağda doğrulama','Manifesto','Kayıt defteri','Kayıt no.','kayıtlı · imzalı','kayıtlı · imza bekliyor','henüz kayıtlı değil','İndirmeyi doğrulayın: PDF’nin SHA-256’sı manifestoda, manifestonun SHA-256’sı ise kayıttır.','orijinal','yükleniyor…','Cüzdanı bağla ve doğrula'],
  id: ['Artikel','Artikel dalam semua bahasa situs. Setiap set diautentikasi di Molibra oleh satu catatan di DocumentRegistry.','Baca PDF','Bahasa','SHA-256','Autentikasi di jaringan','Manifes','Registri','Catatan no.','terdaftar · ditandatangani','terdaftar · menunggu tanda tangan','belum terdaftar','Periksa unduhan: SHA-256 PDF ada di manifes, dan SHA-256 manifes adalah catatannya.','asli','memuat…','Hubungkan dompet dan autentikasi'],
  hi: ['लेख','साइट की सभी भाषाओं में लेख। हर सेट Molibra पर DocumentRegistry के एक रिकॉर्ड से प्रमाणित है।','PDF पढ़ें','भाषाएँ','SHA-256','नेटवर्क पर प्रमाणीकरण','मैनिफ़ेस्ट','रजिस्ट्री','रिकॉर्ड सं.','पंजीकृत · हस्ताक्षरित','पंजीकृत · हस्ताक्षर की प्रतीक्षा','अभी पंजीकृत नहीं','डाउनलोड जाँचें: PDF का SHA-256 मैनिफ़ेस्ट में है, और मैनिफ़ेस्ट का SHA-256 ही रिकॉर्ड है।','मूल','लोड हो रहा है…','वॉलेट जोड़ें और प्रमाणित करें'],
  ar: ['مقالات','المقالات بجميع لغات الموقع. كل مجموعة موثّقة على Molibra بسجلّ واحد في DocumentRegistry.','اقرأ ملف PDF','اللغات','SHA-256','التوثيق على الشبكة','البيان','السجلّ','السجلّ رقم','مسجّل · موقّع','مسجّل · بانتظار التوقيع','غير مسجّل بعد','تحقّق من التنزيل: بصمة SHA-256 لملف PDF موجودة في البيان، وبصمة SHA-256 للبيان هي السجلّ.','الأصل','جارٍ التحميل…','اربط المحفظة ووثّق'],
  ja: ['論文','サイトのすべての言語で読める論文です。各セットは DocumentRegistry の 1 件の記録で Molibra 上に認証されています。','PDF を読む','言語','SHA-256','ネットワーク上の認証','マニフェスト','レジストリ','記録番号','登録済み・署名済み','登録済み・署名待ち','未登録','ダウンロードの確認：PDF の SHA-256 はマニフェストに記載され、マニフェストの SHA-256 が記録です。','原文','読み込み中…','ウォレットを接続して認証'],
  ko: ['논문','사이트의 모든 언어로 제공되는 논문입니다. 각 묶음은 DocumentRegistry의 기록 1건으로 Molibra에서 인증됩니다.','PDF 읽기','언어','SHA-256','네트워크 인증','매니페스트','레지스트리','기록 번호','등록됨 · 서명됨','등록됨 · 서명 대기','아직 등록되지 않음','다운로드 확인: PDF의 SHA-256은 매니페스트에 있고, 매니페스트의 SHA-256이 기록입니다.','원문','불러오는 중…','지갑 연결 후 인증'],
  zh: ['文章','以本站所有语言提供的文章。每一组都由 DocumentRegistry 中的一条记录在 Molibra 上认证。','阅读 PDF','语言','SHA-256','网络认证','清单','登记处','记录编号','已登记 · 已签署','已登记 · 等待签署','尚未登记','核对下载：PDF 的 SHA-256 列在清单中，清单的 SHA-256 就是链上记录。','原文','加载中…','连接钱包并认证'],
};
const RTL = new Set(['ar']);
const $ = (id) => document.getElementById(id);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };

let LANG = 'pt';
try {
  const q = new URLSearchParams(location.search).get('lang');
  const saved = localStorage.getItem('molibraLang');
  const nav = (navigator.language || 'pt').slice(0, 2).toLowerCase();
  LANG = [q, saved, nav].find((c) => c && T[c]) || 'pt';
} catch { /* storage blocked: Portuguese */ }

for (const [c, n] of LANGS) { const o = el('option', null, n); o.value = c; $('lang').append(o); }
$('lang').value = LANG;
$('lang').onchange = () => { LANG = $('lang').value; try { localStorage.setItem('molibraLang', LANG); } catch {} render(); };

let DATA = null;
const status = new Map();   // manifest sha -> { n, signed, revoked } | 'error'

async function rpc(method, params) {
  const r = await fetch(NODE, { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ jsonrpc: '2.0', id: 1, method, params }) });
  const j = await r.json(); if (j.error) throw new Error(j.error.message); return j.result;
}
async function chainStatus(sha) {
  const h = sha.replace(/^0x/, '');
  const n = BigInt(await rpc('eth_call', [{ to: REGISTRY, data: SEL.numberOf + h }, 'latest']));
  if (n === 0n) return { n: 0n };
  const w = (await rpc('eth_call', [{ to: REGISTRY, data: SEL.status + h }, 'latest'])).slice(2).match(/.{64}/g);
  return { n, signed: BigInt('0x' + w[5]) === 1n, revoked: BigInt('0x' + w[6]) > 0n };
}

function render() {
  const t = T[LANG];
  document.documentElement.lang = LANG;
  document.documentElement.dir = RTL.has(LANG) ? 'rtl' : 'ltr';
  $('h1').textContent = t[0]; $('sub').textContent = t[1];
  const list = $('list'); list.replaceChildren();
  if (!DATA) { $('state').textContent = t[14]; return; }
  $('state').textContent = '';
  for (const a of DATA.articles) {
    const card = el('section', 'card');
    const mine = a.languages.find((l) => l.code === LANG) || a.languages.find((l) => l.code === a.original) || a.languages[0];
    card.append(el('h2', null, mine.title));
    card.append(el('p', 'meta', `${a.author} · ${a.date}`));
    const open = el('a', 'open', `${t[2]} (${mine.name})`); open.href = `/articles/${a.slug}/${mine.file}`; card.append(open);

    const table = el('table'); const head = el('tr');
    head.append(el('th', null, t[3]), el('th', null, ''), el('th', 'hide-sm', t[4]));
    table.append(head);
    for (const l of a.languages) {
      const tr = el('tr', l.code === mine.code ? 'cur' : null);
      const name = el('td'); const link = el('a', null, l.name); link.href = `/articles/${a.slug}/${l.file}`;
      name.append(link); if (l.code === a.original) name.append(el('span', 'mono', ` · ${t[13]}`));
      const title = el('td', null, l.title); title.dir = RTL.has(l.code) ? 'rtl' : 'ltr'; title.lang = l.code;
      tr.append(name, title, el('td', 'mono hide-sm', l.sha256));
      table.append(tr);
    }
    card.append(table);

    const auth = el('div', 'auth'); auth.append(el('strong', null, t[5]));
    const dl = el('dl');
    const mLink = el('a', null, a.manifest.file); mLink.href = `/articles/${a.slug}/${a.manifest.file}`;
    const add = (k, v) => { const dd = el('dd'); dd.append(v); dl.append(el('dt', null, k), dd); };
    add(t[6], mLink);
    add('SHA-256', el('span', 'mono', '0x' + a.manifest.sha256));
    const regLink = el('a', 'mono', a.registry); regLink.href = `/molibra/documents?hash=0x${a.manifest.sha256}`;
    add(t[7], regLink);
    const s = status.get(a.manifest.sha256);
    let badge, regHref = null;
    if (!s || s === 'error') badge = el('span', 'badge wait', s === 'error' ? '—' : t[14]);
    else if (s.n === 0n) {
      badge = el('span', 'badge no', t[11]);
      regHref = `/molibra/documents?hash=0x${a.manifest.sha256}&label=${encodeURIComponent(a.label)}&signers=${OPERATOR}`;
    } else badge = el('span', 'badge ' + (s.revoked ? 'no' : s.signed ? 'ok' : 'wait'),
      `${s.n} · ${s.revoked ? 'revoked' : s.signed ? t[9] : t[10]}`);
    add(t[8], badge);
    auth.append(dl, el('p', null, t[12]));
    // ⛔ Signing happens on /molibra/documents, in the visitor's own wallet; this
    //    page holds no key. The button is the way in, pre-filled with this record.
    if (regHref) { const go = el('a', 'open', '🦊 ' + t[15]); go.href = regHref; auth.append(go); }
    card.append(auth);
    list.append(card);
  }
}

render();
fetch('/articles/index.json').then((r) => r.json()).then(async (d) => {
  DATA = d; render();
  for (const a of d.articles) {
    try { status.set(a.manifest.sha256, await chainStatus(a.manifest.sha256)); }
    catch { status.set(a.manifest.sha256, 'error'); }
  }
  render();
}).catch(() => { $('state').textContent = '—'; });
$('foot').textContent = 'Molibra · chain 20226 · DocumentRegistry ' + REGISTRY;
</script>
</html>
